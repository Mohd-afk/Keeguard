<!-- PURPOSE: Browser extension popup interface file for popup.html. -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="logo">K</div>
        <span>KeeGuard</span>
      </div>
      <button id="lock-btn" class="icon-btn" title="Lock Vault" style="display: none;">🔒</button>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="screen">
      <h2>Unlock Vault</h2>
      <p class="subtitle">Enter your KeeGuard credentials</p>
      
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email-input" placeholder="you@example.com">
      </div>
      
      <div class="form-group">
        <label>Master Password</label>
        <input type="password" id="password-input" placeholder="••••••••">
      </div>
      
      <button id="login-btn" class="primary-btn">Unlock</button>
      <div id="login-error" class="error-msg" style="display: none;"></div>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="screen" style="display: none;">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="matching">Matching</button>
        <button class="tab-btn" data-tab="all">All Items</button>
        <button class="tab-btn" data-tab="profiles">Profiles</button>
        <button class="tab-btn" data-tab="generator">Generator</button>
      </div>

      <!-- Matching Tab Content -->
      <div id="tab-matching" class="tab-content">
        <div class="search-bar">
          <input type="text" id="matching-search" placeholder="Search matching items...">
        </div>
        <div id="matching-list" class="items-list">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- All Items Tab Content -->
      <div id="tab-all" class="tab-content" style="display: none;">
        <div class="search-bar">
          <input type="text" id="all-search" placeholder="Search all items...">
        </div>
        <div id="all-list" class="items-list">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Profiles Tab Content -->
      <div id="tab-profiles" class="tab-content" style="display: none;">
        <div class="search-bar" style="display:flex;gap:6px;align-items:center;">
          <input type="text" id="profiles-search" placeholder="Search field profiles..." style="flex:1;">
          <button id="capture-page-btn" class="action-btn-sm" title="Capture form fields from this page" style="white-space:nowrap;flex-shrink:0;">📷 Capture</button>
        </div>
        <div id="profiles-list" class="items-list">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Capture Modal Overlay -->
      <div id="capture-modal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);flex-direction:column;">
        <div style="background:#0f172a;border:1px solid rgba(255,255,255,0.1);border-radius:16px 16px 0 0;position:absolute;bottom:0;left:0;right:0;max-height:90%;display:flex;flex-direction:column;">
          <div style="padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-weight:600;color:#fff;font-size:14px;">📷 Captured Fields</div>
              <div id="capture-subtitle" style="font-size:11px;color:#94a3b8;margin-top:2px;"></div>
            </div>
            <button id="capture-close-btn" style="background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:4px;">✕</button>
          </div>
          <div style="padding:10px 16px 4px;">
            <input id="capture-profile-name" type="text" placeholder="Profile name (e.g. Flipkart Listing)" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 12px;color:#fff;font-size:13px;outline:none;">
          </div>
          <div style="font-size:11px;color:#64748b;padding:4px 16px 6px;">Uncheck fields you don't want to import:</div>
          <div id="capture-fields-list" style="overflow-y:auto;flex:1;padding:0 16px 8px;max-height:280px;"></div>
          <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px;">
            <button id="capture-save-btn" class="primary-btn" style="flex:1;padding:10px;font-size:13px;">✅ Save as Profile</button>
          </div>
        </div>
      </div>


      <!-- Generator Tab Content -->
      <div id="tab-generator" class="tab-content" style="display: none;">
        <h2>Password Generator</h2>
        
        <div class="pwd-display-container">
          <input type="text" id="gen-pwd" readonly>
          <button id="copy-gen-pwd" class="icon-btn">📋</button>
        </div>

        <div class="settings-group">
          <div class="setting-row">
            <label>Length: <span id="length-val">16</span></label>
            <input type="range" id="length-slider" min="8" max="64" value="16">
          </div>
          
          <div class="setting-row toggle-row">
            <label>Uppercase (A-Z)</label>
            <input type="checkbox" id="opt-upper" checked>
          </div>
          
          <div class="setting-row toggle-row">
            <label>Lowercase (a-z)</label>
            <input type="checkbox" id="opt-lower" checked>
          </div>
          
          <div class="setting-row toggle-row">
            <label>Numbers (0-9)</label>
            <input type="checkbox" id="opt-nums" checked>
          </div>
          
          <div class="setting-row toggle-row">
            <label>Symbols (!@#...)</label>
            <input type="checkbox" id="opt-symbols" checked>
          </div>
        </div>

        <button id="generate-btn" class="primary-btn">Generate</button>
      </div>
    </div>

    <!-- Floating Toast Notification -->
    <div id="toast-msg" class="toast" style="display: none;"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
